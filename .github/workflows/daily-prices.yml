# Weckt den Render-Server und startet den Tages-Job (Preise, Verlauf, Push).
# Secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   BACKEND_URL  z. B. https://pokemon-backend-x7l7.onrender.com   (ohne Slash am Ende)
#   CRON_SECRET  derselbe Wert wie CRON_SECRET bei Render
name: daily-prices
on:
  schedule:
    - cron: '30 6 * * *'    # UTC
    - cron: '30 12 * * *'   # zweiter Lauf, falls Cardmarket die Tagesdatei später veröffentlicht hat
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Tages-Job anstoßen
        run: curl -fsS --retry 3 --retry-delay 30 --max-time 900 -X POST "https://pokemon-backend-x717.onrender.com/api/cron/daily?wait=1"
